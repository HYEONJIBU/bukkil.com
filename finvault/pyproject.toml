[project]
name = "finvault"
version = "0.1.0"
description = "DART OpenAPI 재무제표/정기보고서를 SQLite로 DB화하고 분석하는 도구"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
finvault = "finvault.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
